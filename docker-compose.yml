services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Your hosted Postgres connection string, read from .env (required).
      # Use the pooler/transaction endpoint for Neon/Supabase.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in your .env file (hosted postgresql:// URL)}
      # Fails fast at `docker compose up` if JWT_SECRET isn't in .env.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your .env file}
      PORT: 3000
      # Seed the demo admin/user accounts on first boot (see prisma/seed.js).
      # Only enable for testing — it ships default credentials.
      DB_SEED: "false"
    env_file:
      # Injects the rest of your config (AI_API_TOKEN, PG_BOUNCER,
      # PRISMA_CONNECTION_LIMIT, rate limits, etc.).
      - .env
    volumes:
      - book-storage:/app/storage

volumes:
  book-storage:
